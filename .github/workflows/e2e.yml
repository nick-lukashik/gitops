name: e2e

# The deployed set end to end (e2e/README.md): the images of apps/*/prod by
# digest, their data stores and Mailpit in Docker Compose, one Playwright
# scenario through id-web from the sign-in email to the receipt email. Runs on
# PRs that change the deployed set (the deploy PRs) or the e2e itself, and by
# hand. Images are pulled, never built. The check `e2e` is required by the master
# ruleset, so every PR reports it: one that changes none of those files passes
# without a run. The failure scenarios (tag @failure) stop parts of the stack and
# take longer: nightly and by hand, never on a PR. The nightly result goes to the
# Telegram topic Alerts, either way.

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      pay-api-image:
        description: "pay-api instead of the pin in e2e/pay-api.env: ghcr.io/nick-lukashik/pay-api:<tag> or @sha256:<digest>. Empty uses the pin."
        type: string
        default: ""
      notify:
        description: "Send the result to Telegram, as the nightly run does"
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Whether this PR needs a run. Here and not in `paths`: a workflow skipped by
  # `paths` reports nothing, and a required check would wait for it for ever.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.files.outputs.run }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -qE '^(apps/[^/]+/prod/|e2e/|scripts/versions\.sh$|\.github/workflows/e2e\.yml$)' <<<"$files"; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi

  suite:
    # A PR has the deploy suite, the nightly run the failure scenarios, a run by
    # hand both.
    name: ${{ matrix.suite == 'failure' && 'e2e failure scenarios' || 'e2e deploy scenario' }}
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'pull_request' && '["deploy"]' || github.event_name == 'schedule' && '["failure"]' || '["deploy","failure"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.suite == 'failure' && 45 || 15 }}
    permissions:
      contents: read
    env:
      E2E_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The record of what this run tested, in the job summary: only the images it
      # starts, so that a deploy of anything else does not read as tested.
      - name: Deployed set
        run: |
          scripts/versions.sh | tee "$RUNNER_TEMP/versions.txt"
          {
            echo '### Images this run starts'
            echo '```'
            head -n 1 "$RUNNER_TEMP/versions.txt"
            tail -n +2 "$RUNNER_TEMP/versions.txt" | while read -r service rest; do
              if grep -qF "\${$(tr 'a-z-' 'A-Z_' <<<"$service")_IMAGE:" e2e/compose.yaml; then
                echo "$service $rest"
              fi
            done
            echo '```'
            echo
            echo 'In the deployed set, not started:'
            tail -n +2 "$RUNNER_TEMP/versions.txt" | while read -r service _; do
              if ! grep -qF "\${$(tr 'a-z-' 'A-Z_' <<<"$service")_IMAGE:" e2e/compose.yaml; then
                echo "- $service"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The input, or the pin; once apps/pay-api/prod exists stack.ts takes the deployed digest over the pin.
      - name: pay-api image
        env:
          IMAGE: ${{ inputs.pay-api-image }}
        run: |
          if [[ -n $IMAGE ]]; then
            if [[ ! $IMAGE =~ ^ghcr\.io/nick-lukashik/pay-api(:[A-Za-z0-9._-]{1,128}|@sha256:[0-9a-f]{64})$ ]]; then
              echo "::error::pay-api-image: ghcr.io/nick-lukashik/pay-api:<tag> or @sha256:<digest>"
              exit 1
            fi
            echo "PAY_API_IMAGE=$IMAGE" >> "$GITHUB_ENV"
            echo "pay-api: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pay-api: \`$(sed -n 's/^PAY_API_IMAGE=//p' e2e/pay-api.env)\` (the pin in e2e/pay-api.env)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: e2e/tests/package.json
          cache: true
          cache_dependency_path: e2e/tests/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/tests/.node-version

      - name: Install dependencies
        working-directory: e2e/tests
        run: pnpm install --frozen-lockfile

      # Biome and tsc of the test code; make verify (ci / verify) covers the rest.
      - name: Lint and typecheck
        working-directory: e2e/tests
        run: pnpm verify

      - name: Install Playwright browser
        working-directory: e2e/tests
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # The global setup brings the stack up and removes it after the tests.
      - name: End-to-end tests
        working-directory: e2e/tests
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.suite }}
          path: |
            e2e/tests/playwright-report/
            e2e/tests/test-results/
          retention-days: 7

  # The required check: it always reports on a PR, whatever the run above did.
  e2e:
    name: e2e
    needs:
      - changes
      - suite
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SUITE: ${{ needs.suite.result }}
        run: |
          [[ $CHANGES == success ]] || { echo "::error::could not tell what this PR changes: $CHANGES"; exit 1; }
          [[ $SUITE == success || $SUITE == skipped ]] || { echo "::error::the end-to-end run: $SUITE"; exit 1; }

  notify:
    name: Nightly result in Telegram
    needs: suite
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.notify) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Send
        env:
          TG_TOKEN: ${{ secrets.OPS_TELEGRAM_TOKEN }}
          RESULT: ${{ needs.suite.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chat=$(yq -r '.telegram.chatId' components/settings/settings.yaml)
          topic=$(yq -r '.telegram.topics.alerts' components/settings/settings.yaml)
          if [[ $RESULT == success ]]; then
            text="✅ Ночные тесты сбоев прошли."
          else
            text="❌ Ночные тесты сбоев не прошли: $RESULT."
          fi
          # The token through --config: it stays out of the process list.
          printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "$TG_TOKEN" |
            curl -sS --fail --max-time 20 -o /dev/null --config - \
              --data-urlencode "chat_id=$chat" \
              --data-urlencode "message_thread_id=$topic" \
              --data-urlencode "text=$text $RUN_URL"
