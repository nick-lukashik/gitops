apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Prefixes the host set by components/host with ConfigMap route .data.subdomain
# (local config in the including kustomization): id -> id.<domain>.
replacements:
  - source:
      kind: ConfigMap
      name: route
      fieldPath: data.subdomain
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - metadata.annotations.nl-gitops/host
        options:
          delimiter: "."
          index: -1
  - source:
      kind: IngressRoute
      fieldPath: metadata.annotations.nl-gitops/host
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - spec.routes.0.match
        options:
          delimiter: "`"
          index: 1
