apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# An api that no browser reaches, after components/api instead of a host: no
# IngressRoute and no ingress from Traefik. Only its callers (listed in
# apps/<name>/prod) and Prometheus reach it; the smoke check after a deploy
# skips it (no route).
patches:
  - target:
      kind: IngressRoute
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: any
  # The first ingress rule of components/service is Traefik.
  - target:
      kind: NetworkPolicy
      labelSelector: app.kubernetes.io/component=server
    patch: |-
      - op: test
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: traefik
      - op: remove
        path: /spec/ingress/0
