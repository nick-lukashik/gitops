# Common part of every service (service runtime contract). SERVICE is replaced
# with ConfigMap service .data.name of the including kustomization; the image
# becomes ghcr.io/nick-lukashik/<name>, and its digest comes from the images:
# entry of apps/<name>/prod (the deploy PR changes only that digest).
#
# Argo CD sync waves: config, secrets, Service, route and policy in waves -1/0,
# the api migrate Job (components/api) in wave 0, the Deployment in wave 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE
  labels:
    app.kubernetes.io/name: SERVICE
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: nick-lukashik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # No replicas here: the HorizontalPodAutoscaler below owns the count (2 to 4).
  revisionHistoryLimit: 3
  # Start a new pod first and stop an old one only once it is ready: a rollout
  # never leaves fewer ready pods than before it.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: SERVICE
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: SERVICE
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: nick-lukashik
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: service
      # One node today. With more nodes the replicas spread out, never blocking.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: SERVICE
              app.kubernetes.io/component: server
      # preStop sleep 5 s + the app's own shutdown (at most 25 s).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/nick-lukashik/SERVICE
          # env wins over envFrom: the port is owned by the platform.
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: SERVICE-config
            - secretRef:
                name: SERVICE-secrets
                optional: true
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Defaults of the web kind; components/api raises memory. CPU has a
          # request (scheduling share) and no limit: a CFS quota throttles the
          # event loop under bursts (latency, failed probes) while the node has
          # idle cores. The memory limit is what protects the node.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          # Cold start of Next.js or Nest with a slow dependency: up to 2 minutes.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Native sleep action (no shell in the image needed): Traefik and the
            # Endpoints drop the pod before SIGTERM reaches the app.
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE
  labels:
    app.kubernetes.io/name: SERVICE
    app.kubernetes.io/part-of: nick-lukashik
spec:
  selector:
    app.kubernetes.io/name: SERVICE
    app.kubernetes.io/component: server
  ports:
    # http://<name>.prod.svc for in-cluster callers.
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: SERVICE
  annotations:
    # Public host, set by components/host (+ components/subdomain). The smoke
    # check after a deploy reads it from here.
    nl-gitops/host: DOMAIN
    nl-gitops/smoke-paths: "/"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`DOMAIN`)
      middlewares:
        # Shared middleware of the Traefik file provider (platform/traefik-config):
        # the client address from Cloudflare. components/api appends body-limit;
        # web limits bodies in the app, because Traefik buffering would also
        # buffer whole responses and break streamed HTML.
        - name: real-ip@file
      services:
        - name: SERVICE
          port: http
  tls: {}
---
# Network of the service pods; the namespace denies everything else, both ways
# (platform/policies/prod.yaml). components/api adds api clients and Prometheus
# (ingress) and data stores and public HTTPS (egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: SERVICE
  labels:
    app.kubernetes.io/name: SERVICE
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: nick-lukashik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: SERVICE
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik of K3s, on the public port only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
  egress:
    # Cluster DNS only (CoreDNS of K3s). The pods resolve the kube-dns Service;
    # policies see the CoreDNS pod after kube-proxy's DNAT.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# At least two replicas, so a rollout, a crash or an eviction never leaves the
# service without a ready pod; up to four while CPU stays above 75% of the
# request. Every service is stateless for this (service contract, "Replicas").
# Wave 2, after its Deployment (wave 1): an HPA without its target is Degraded,
# and Argo CD would stop the first sync of a new service at that wave.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: SERVICE
  labels:
    app.kubernetes.io/name: SERVICE
    app.kubernetes.io/part-of: nick-lukashik
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: SERVICE
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    # Scale down slowly: a short quiet spell is not a reason to drop pods.
    scaleDown:
      stabilizationWindowSeconds: 300
---
# One pod at a time may go for a voluntary disruption (eviction, drain). On the
# single node a drain waits on this, so drain it with --disable-eviction.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: SERVICE
  labels:
    app.kubernetes.io/name: SERVICE
    app.kubernetes.io/part-of: nick-lukashik
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: SERVICE
      app.kubernetes.io/component: server
