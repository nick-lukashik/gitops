# Common part of every service (service runtime contract). SERVICE is replaced
# with ConfigMap service .data.name of the including kustomization; the image
# becomes ghcr.io/nick-lukashik/<name>, and its digest comes from the images:
# entry of apps/<name>/prod (the deploy PR changes only that digest).
#
# Argo CD sync waves: config, secrets, Service, route and policy in waves -1/0,
# the api migrate Job (components/api) in wave 0, the Deployment in wave 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE
  labels:
    app.kubernetes.io/name: SERVICE
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: nick-lukashik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # One replica: start the new pod first, stop the old one once it is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: SERVICE
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: SERVICE
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: nick-lukashik
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: service
      # preStop sleep 5 s + the app's own shutdown (at most 25 s).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/nick-lukashik/SERVICE
          # env wins over envFrom: the port is owned by the platform.
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: SERVICE-config
            - secretRef:
                name: SERVICE-secrets
                optional: true
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Defaults of the web kind; components/api raises memory. CPU has a
          # request (scheduling share) and no limit: a CFS quota throttles the
          # event loop under bursts (latency, failed probes) while the node has
          # idle cores. The memory limit is what protects the node.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          # Cold start of Next.js or Nest with a slow dependency: up to 2 minutes.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Native sleep action (no shell in the image needed): Traefik and the
            # Endpoints drop the pod before SIGTERM reaches the app.
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE
  labels:
    app.kubernetes.io/name: SERVICE
    app.kubernetes.io/part-of: nick-lukashik
spec:
  selector:
    app.kubernetes.io/name: SERVICE
    app.kubernetes.io/component: server
  ports:
    # http://<name>.prod.svc for in-cluster callers.
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: SERVICE
  annotations:
    # Public host, set by components/host (+ components/subdomain). The smoke
    # check after a deploy reads it from here.
    nl-gitops/host: DOMAIN
    nl-gitops/smoke-paths: "/"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`DOMAIN`)
      middlewares:
        # Shared middleware of the Traefik file provider (platform/traefik-config):
        # the client address from Cloudflare. components/api appends body-limit;
        # web limits bodies in the app, because Traefik buffering would also
        # buffer whole responses and break streamed HTML.
        - name: real-ip@file
      services:
        - name: SERVICE
          port: http
  tls: {}
---
# Network of the service pods; the namespace denies everything else, both ways
# (platform/policies/prod.yaml). components/api adds api clients and Prometheus
# (ingress) and data stores and public HTTPS (egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: SERVICE
  labels:
    app.kubernetes.io/name: SERVICE
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: nick-lukashik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: SERVICE
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik of K3s, on the public port only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
  egress:
    # Cluster DNS only (CoreDNS of K3s). The pods resolve the kube-dns Service;
    # policies see the CoreDNS pod after kube-proxy's DNAT.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
