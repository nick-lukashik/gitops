apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# web kind (Next.js), after components/service: writable /app/.next/cache,
# pod label kind=web. With that label NetworkPolicy api-clients
# (platform/policies/prod.yaml) gives its pods egress to api pods on http, and
# the called api lists it as a caller in apps/<name>/prod. No other egress than
# DNS (components/service).
# SESSION_SECRET: the key of the session cookie, one for every site under the
# domain (SECRETS.md, web-session). Required: a pod starts only with it.
# No migrations and no metrics endpoint: HTTP metrics come from Traefik.
# Resources: the defaults of components/service.
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
      spec:
        template:
          metadata:
            labels:
              nick-lukashik.com/kind: web
          spec:
            containers:
              - name: app
                env:
                  - name: SESSION_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: web-session
                        key: SESSION_SECRET
                volumeMounts:
                  - name: next-cache
                    mountPath: /app/.next/cache
            volumes:
              # Image optimizer and fetch cache. Going over sizeLimit evicts the pod.
              - name: next-cache
                emptyDir:
                  sizeLimit: 512Mi
