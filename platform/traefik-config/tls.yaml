# Default TLS for every router on websecure.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: wildcard-nick-lukashik-com-tls
  # sniStrict (TLSOption below) matches the SNI only against these certificates,
  # never against defaultCertificate: without this list every handshake fails
  # with "unrecognized name" (Cloudflare 525).
  certificates:
    - secretName: wildcard-nick-lukashik-com-tls
---
# TLS 1.2+, and only Cloudflare may connect: a client certificate signed by the
# Authenticated Origin Pulls CA is required. A direct connection fails the handshake.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  minVersion: VersionTLS12
  sniStrict: true
  cipherSuites:
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  clientAuth:
    clientAuthType: RequireAndVerifyClientCert
    secretNames:
      - cloudflare-origin-pull-ca
---
# Wildcard certificate; secret used by the default TLSStore.
# Issuer: letsencrypt (production, platform/cert-manager/config/clusterissuers.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-nick-lukashik-com
  namespace: traefik
spec:
  secretName: wildcard-nick-lukashik-com-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - DOMAIN
    - "*.DOMAIN"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
