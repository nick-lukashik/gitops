# Budget: docs/resources.md.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: prod
spec:
  hard:
    requests.memory: 6Gi
    limits.memory: 12Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: prod
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        memory: 256Mi
---
# Default deny, both ways: a pod of prod gets only what a NetworkPolicy allows.
# The allows (K3s network policy controller, kube-router):
# - components/service: ingress from Traefik on http; egress to CoreDNS only;
# - components/api: ingress from Prometheus on metrics;
#   egress to data namespaces and to public addresses on 443; the migrate Job:
#   egress to CoreDNS and data namespaces;
# - api-clients below: egress of web and api pods to api pods; the ingress of
#   each api lists its callers in apps/<name>/prod.
# Kubelet probes come from the node and are always allowed by kube-router.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Server-side calls to the api services: every web and api pod may try to reach
# api pods on http. Which calls get through is up to the called api: it lists
# its callers in apps/<name>/prod, and every other pod is refused at its door.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-clients
  namespace: prod
spec:
  podSelector:
    matchExpressions:
      - key: nick-lukashik.com/kind
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              nick-lukashik.com/kind: api
              app.kubernetes.io/component: server
      ports:
        # Container port http of every service (components/service: PORT=3000).
        # Numeric: the Service maps port 80 to it, and policies see the pod port.
        - port: 3000
          protocol: TCP
