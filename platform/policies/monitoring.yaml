# Default deny ingress for the monitoring namespaces: a pod there accepts only
# what an allow-list lets in. The allow-lists live next to their components:
# - kube-prometheus-stack/config: from-prometheus (scrapes of every pod),
#   prometheus and alertmanager (from Grafana);
# - loki/config: from Alloy and Grafana;
# - grafana/config: from Traefik;
# - alloy/config: from Prometheus.
# Egress stays open: Prometheus scrapes every namespace, Alertmanager calls
# Telegram and Healthchecks, Loki writes to R2.
#
# K3s (kube-router) specifics: traffic from the node itself (kubelet probes,
# kubectl port-forward, hostNetwork pods) is always allowed, and pods with
# hostNetwork are never selected. node-exporter runs with hostNetwork, so no
# policy can restrict who reaches it on 9100; the pods that are not trusted
# (prod) cannot reach any node port: their egress is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring-node
spec:
  podSelector: {}
  policyTypes:
    - Ingress
