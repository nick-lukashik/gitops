# App-of-apps: Application "root" (bootstrap/root.yaml) syncs this list.
# Order by argocd.argoproj.io/sync-wave; root waits for each wave to be healthy:
#   -20 projects, -15 policies, -10 sealed-secrets argocd,
#   -5 cert-manager kube-prometheus-stack (CRDs the rest uses),
#    0 everything else. The last wave is not waited for, so an app that waits
#      for a secret (grafana) never blocks the others.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - argocd/projects.yaml
  - policies/application.yaml
  - sealed-secrets/application.yaml
  - argocd/application.yaml
  - cert-manager/application.yaml
  - monitoring/kube-prometheus-stack/application.yaml
  - traefik-config/application.yaml
  - monitoring/loki/application.yaml
  - monitoring/rules/application.yaml
  - monitoring/alloy/application.yaml
  - monitoring/grafana/application.yaml
  - argocd/apps-prod.yaml
