# CloudNativePG operator: runs the Postgres cluster of platform/data/stores.
# Its CRDs come before the stores (wave -5, like cert-manager).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1
      helm:
        releaseName: cnpg
        valueFiles:
          - $values/platform/data/cnpg/values.yaml
    - repoURL: https://github.com/nick-lukashik/gitops.git
      targetRevision: master
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The CRDs are larger than the annotation client-side apply keeps.
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
