# Barman Cloud plugin of CloudNativePG (CNPG-I): base backups and WAL of the
# Postgres cluster to R2. It lives next to the operator (same namespace) and
# needs cert-manager for its gRPC certificates, so it comes after both.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: plugin-barman-cloud
      targetRevision: 0.8.1
      helm:
        releaseName: barman-cloud
        valueFiles:
          - $values/platform/data/barman-cloud/values.yaml
    - repoURL: https://github.com/nick-lukashik/gitops.git
      targetRevision: master
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
