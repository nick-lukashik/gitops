# Sealed by the E3 setup (SECRETS.md, "Data stores"). pg-r2 is merged from Bitwarden r2-pg-backups.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pg-id
  namespace: data
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: pg-id
      namespace: data
    type: kubernetes.io/basic-auth
