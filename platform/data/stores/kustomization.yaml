apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - secrets.sealedsecret.yaml
  - postgres.yaml
  - redis.yaml
  - rabbitmq.yaml
  - networkpolicy.yaml
patches:
  # Secrets before what reads them.
  - target:
      group: bitnami.com
      kind: SealedSecret
    patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
