apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - secrets.sealedsecret.yaml
  - postgres.yaml
  - redis.yaml
  - rabbitmq.yaml
  - networkpolicy.yaml
configMapGenerator:
  # Plain definitions, no secrets; the hash in the name restarts the broker on a change.
  - name: rabbitmq-topology
    files:
      - topology.json=rabbitmq-topology.json
generatorOptions:
  annotations:
    # This Application never prunes: a replaced ConfigMap stays behind, and that is not a diff.
    argocd.argoproj.io/compare-options: IgnoreExtraneous
patches:
  # Secrets before what reads them.
  - target:
      group: bitnami.com
      kind: SealedSecret
    patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
