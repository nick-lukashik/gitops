# Namespace data accepts only these (default deny ingress); egress stays open
# like in monitoring: the Postgres pods talk to the Kubernetes API (instance
# manager) and to R2 (backups).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The services and their migrate Jobs (namespace prod), each on its store's port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prod
      ports:
        - port: 5432
        - port: 6379
        - port: 5672
---
# The CNPG operator reaches the instance manager (8000) and Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-cnpg
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-prometheus
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9187
        - port: 15692
