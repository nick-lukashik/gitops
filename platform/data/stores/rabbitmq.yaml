# RabbitMQ 4, one node: the events between the services (outbox → exchange
# <producer>.events → each consumer's queue, retries, DLQ). Users, one per
# api, come from the sealed definitions (rabbitmq-definitions).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
data:
  rabbitmq.conf: |
    load_definitions = /etc/rabbitmq/definitions/definitions.json
    loopback_users.guest = true
    listeners.tcp.default = 5672
    log.console = true
    log.console.level = info
    log.file = false
    # Quorum queues need three nodes to be useful; classic queues are durable here.
    default_queue_type = classic
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.absolute = 1GB
    prometheus.return_per_object_metrics = false
  enabled_plugins: |
    [rabbitmq_prometheus].
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: metrics
      port: 15692
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      priorityClassName: platform-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: rabbitmq
          image: rabbitmq:4.4.0-alpine
          env:
            # A fixed node name: the data directory on the volume is named after it.
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
            - name: RABBITMQ_CONFIG_FILE
              value: /etc/rabbitmq/conf/rabbitmq.conf
            - name: RABBITMQ_ENABLED_PLUGINS_FILE
              value: /etc/rabbitmq/conf/enabled_plugins
          ports:
            - name: amqp
              containerPort: 5672
            - name: metrics
              containerPort: 15692
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 15
            timeoutSeconds: 10
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: conf
              mountPath: /etc/rabbitmq/conf
            - name: definitions
              mountPath: /etc/rabbitmq/definitions
      volumes:
        - name: conf
          configMap:
            name: rabbitmq-config
        - name: definitions
          secret:
            secretName: rabbitmq-definitions
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rabbitmq
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  podMetricsEndpoints:
    - port: metrics
