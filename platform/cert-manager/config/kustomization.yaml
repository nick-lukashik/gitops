apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cf-dns01-token.sealedsecret.yaml
  - clusterissuers.yaml
components:
  - ../../../components/settings
# After the chart (CRDs, webhook) is up.
commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"
replacements:
  - source:
      kind: Settings
      name: settings
      fieldPath: domain
    targets:
      - select:
          kind: ClusterIssuer
        fieldPaths:
          - spec.acme.solvers.0.selector.dnsZones.0
