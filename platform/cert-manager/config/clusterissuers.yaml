# ACME DNS-01 via Cloudflare. Token: SealedSecret cf-dns01-token (DNS edit on the three
# zones); each issuer solves only the zones in its dnsZones selector.
# The zone comes from components/settings. No account email: none is needed for DNS-01.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - selector:
          dnsZones:
            - DOMAIN
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cf-dns01-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - selector:
          dnsZones:
            - DOMAIN
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cf-dns01-token
              key: api-token
