# ACME DNS-01 via Cloudflare. Token: SealedSecret cf-dns01-token (DNS edit on the three
# zones); the issuer solves only the zones in its dnsZones selector.
# The zone comes from components/settings. No account email: none is needed for DNS-01.
# Production only: the token is checked at Cloudflare before it is sealed (SECRETS.md),
# which is what a staging run would catch, and a staging issuer that cannot reach
# Let's Encrypt keeps cert-manager Degraded and holds the later sync waves of root.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - selector:
          dnsZones:
            - DOMAIN
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cf-dns01-token
              key: api-token
