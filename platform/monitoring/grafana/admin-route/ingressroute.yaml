# Disabled until the admin console, stage E4 (see ../config/kustomization.yaml). Built in CI only.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    nl-gitops/host: DOMAIN
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`DOMAIN`) && PathPrefix(`/grafana`)
      middlewares:
        # Shared middlewares of the Traefik file provider (platform/traefik-config).
        # No body-limit@file: see the comment on it there (larger API bodies,
        # streaming; operators only, behind ops-auth).
        - name: real-ip@file
        - name: ops-strip-identity@file
        - name: ops-auth@file
      services:
        - name: grafana
          port: 80
  tls: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: route
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  subdomain: admin
