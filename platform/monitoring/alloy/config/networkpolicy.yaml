# Ingress of Alloy: only Prometheus, on the metrics port (ServiceMonitor
# http-metrics). Namespace monitoring-node denies the rest
# (platform/policies/monitoring.yaml). Alloy itself only sends: logs to Loki.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy
  namespace: monitoring-node
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 12345
