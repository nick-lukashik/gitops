apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - networkpolicy.yaml
# Alloy's config reloader picks up changes of this ConfigMap without a restart.
configMapGenerator:
  - name: alloy-config
    namespace: monitoring-node
    files:
      - config.alloy
    options:
      disableNameSuffixHash: true
