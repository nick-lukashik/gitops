# Grafana Alloy DaemonSet: pod logs and journald -> Loki (pipeline: config/config.alloy).
alloy:
  stabilityLevel: generally-available
  enableReporting: false
  storagePath: /var/lib/alloy/data
  # Pipeline in config/config.alloy (ConfigMap alloy-config, built by kustomize).
  configMap:
    create: false
    name: alloy-config
    key: config.alloy
  mounts:
    varlog: false
    extra:
      - name: journal
        mountPath: /var/log/journal
        readOnly: true
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
      - name: storage
        mountPath: /var/lib/alloy
  # Root reads root-owned journal files; no capabilities.
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

controller:
  type: daemonset
  priorityClassName: platform-critical
  volumes:
    extra:
      - name: journal
        hostPath:
          path: /var/log/journal
          type: Directory
      - name: machine-id
        hostPath:
          path: /etc/machine-id
          type: File
      # Read positions survive restarts: no re-sent or skipped lines.
      - name: storage
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate

# Only what discovery.kubernetes and loki.source.kubernetes need (no secrets).
# The chart joins both lists into one ClusterRole; neither may be empty.
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]
  clusterRules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list", "watch"]

configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

serviceMonitor:
  enabled: true
