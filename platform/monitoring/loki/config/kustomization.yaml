apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - loki-r2.sealedsecret.yaml
  - networkpolicy.yaml
patches:
  # The R2 key before the StatefulSet that reads it (envFrom). A patch, so the
  # kubeseal output replaces the placeholder as is (SECRETS.md).
  - target:
      group: bitnami.com
      kind: SealedSecret
    patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
