apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: services
  namespace: monitoring
spec:
  groups:
    # Degraded states of api services (service runtime contract in nick-lukashik/.github, "Degradation"
    # and "Messaging"). The metrics come from the api metrics port (ServiceMonitor
    # of components/api), so every series has namespace and service labels.
    - name: services
      rules:
        - alert: ServiceDatabaseErrors
          expr: sum by (namespace, service) (increase(http_server_database_failures_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} fails requests on the database"
            description: Requests end with 503 on Postgres timeouts, lock waits or a busy pool.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#servicedatabaseerrors
        - alert: ServiceBrokerDown
          expr: min by (namespace, service) (messaging_broker_up) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} has no RabbitMQ connection"
            description: Writes still succeed; events wait in the outbox until the broker is back.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#servicebrokerdown
        - alert: ServiceConsumerDown
          expr: min by (namespace, service, queue) (messaging_consumer_up) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} does not consume {{ $labels.queue }}"
            description: The consumer keeps failing to re-subscribe; events for this queue are not processed.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#serviceconsumerdown
        - alert: OutboxEventsStuck
          expr: max by (namespace, service) (outbox_oldest_pending_seconds) > 300
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} has events unpublished for over 5 minutes"
            description: The oldest pending outbox event is {{ $value | humanizeDuration }} old.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#outboxeventsstuck
        # No `for`: one returned message already means a topology bug.
        - alert: OutboxEventsUnroutable
          expr: sum by (namespace, service) (increase(outbox_publish_failures_total{reason="unroutable"}[10m])) > 0
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} publishes events no queue receives"
            description: RabbitMQ returned published events (no bound queue); they stay in the outbox and are retried.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#outboxeventsunroutable
        # No `for`: a dead letter is an event no consumer will retry; it waits for a replay.
        - alert: ServiceEventsDeadLettered
          expr: sum by (namespace, service, queue) (increase(messaging_events_consumed_total{outcome="dead_lettered"}[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} dead-lettered events of {{ $labels.queue }}"
            description: Events failed every retry or were invalid; they wait in the dead-letter queue for a fix and a replay.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#serviceeventsdeadlettered
        - alert: ServiceRedisDown
          expr: min by (namespace, service) (redis_up) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} has no Redis connection"
            description: The cache is bypassed and rate limits are not checked.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#serviceredisdown
        # Counts requests that got no rate-limit check: id-api's throttler lets
        # them through, id-api's sign-in limits (RateLimiter) refuse them with 503.
        - alert: RateLimitFailingOpen
          expr: sum by (namespace, service) (increase(rate_limit_fail_open_total[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} cannot check rate limits"
            description: "Redis is down or over its budget: the throttler lets requests through, id-api's sign-in limits refuse them (503)."
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#ratelimitfailingopen
    # Business flows: a user who did not get what they asked for. The counters come
    # from id-api, notifications-api and pay-api, with the same labels as above.
    - name: business
      rules:
        # result failed (notifications-api answered but did not send it) or unreachable (no
        # answer, not 2xx). Over 10 minutes, so one lost code (the user asks again) does not fire.
        - alert: AuthCodeDeliveryFailing
          expr: sum by (namespace, service) (rate(auth_code_deliveries_total{result!="accepted"}[10m])) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} does not deliver sign-in codes"
            description: Users get no sign-in code (notifications-api unreachable or not sending), so they cannot sign in.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#authcodedeliveryfailing
        # No `for`: a job is counted only after its last retry, so every one is an email lost.
        # A counter that is not pre-initialized appears with its first failure, already at 1,
        # which increase() cannot see, so a series new within the hour counts too; one
        # pre-initialized at 0 stays out by the > 0. New: no sample in the hour before the
        # last one. A plain offset 1h would take a scrape gap at t-1h for a new series.
        - alert: EmailJobsFailed
          expr: |
            sum by (namespace, service, template) (increase(emails_failed_total[1h])) > 0
            or
            sum by (namespace, service, template) (emails_failed_total unless last_over_time(emails_failed_total[1h] offset 1h)) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} gave up on {{ $labels.template }} emails"
            description: Email jobs failed every retry in the last hour; their users did not get them.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#emailjobsfailed
        # No `for`: each one is a payment someone has to look at.
        - alert: PaymentWebhooksUnmatched
          expr: sum by (namespace, service, result) (increase(payment_webhooks_total{result=~"unmatched|mismatch"}[30m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} could not apply payment webhooks ({{ $labels.result }})"
            description: A provider webhook matched no payment (unmatched) or not its amount or currency (mismatch); the money it reports is not credited yet.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentwebhooksunmatched
        # A paid payment missing from the ledger after its grace period: paid without coins.
        - alert: PaymentsUnreconciled
          expr: max by (namespace, service) (payments_unreconciled) > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} has {{ $value }} paid payments not in the ledger"
            description: Reconciliation has been sending these events again for 30 minutes and wallet-api still has no pack for them; the buyers paid and have no coins.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentsunreconciled
        # No `for`: the ledger was behind and reconciliation fixed it, once, and that should not happen.
        - alert: PaymentEventsRepublished
          expr: sum by (namespace, service) (increase(payment_reconciliation_total{result="republished"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} sent payment events to the ledger again"
            description: A paid payment was not in the ledger past its grace period, so its event went out again. Coins were late; find out why the first event did not get there.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymenteventsrepublished
        # No `for`: each one is a payment someone has to look at. It stays pending, so it keeps firing until they do.
        - alert: PaymentProviderMismatch
          expr: sum by (namespace, service) (increase(payment_provider_sync_total{result="mismatch"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} found a payment whose provider record differs"
            description: The provider's own record of a pending payment shows another amount or currency. The payment stays pending and no coins are credited.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentprovidermismatch
        # A payment the provider paid and whose webhook never came. One can get lost; more mean the webhook is broken.
        - alert: PaymentWebhooksLost
          expr: sum by (namespace, service) (increase(payment_provider_sync_total{result="applied"}[6h])) > 1
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} paid several payments whose webhooks never came"
            description: Provider sync settled these payments, so the buyers got their coins, but late. The provider's webhooks are not reaching pay-api.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentwebhookslost
        # Over 30 minutes: a provider's short outage heals by itself.
        - alert: PaymentProviderUnreachable
          expr: |
            sum by (namespace, service) (increase(payment_provider_sync_total{result="error"}[30m])) > 0
            unless
            sum by (namespace, service) (increase(payment_provider_sync_total{result=~"applied|open|missing|mismatch"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} cannot ask the payment provider"
            description: Every lookup of provider sync has failed for 30 minutes, so a payment whose webhook is lost stays pending until the provider answers again.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentproviderunreachable
        # Webhooks of a success the provider's record does not confirm: its retries go on until it does.
        - alert: PaymentWebhooksDeferred
          expr: sum by (namespace, service) (increase(payment_webhooks_total{result="deferred"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.service }} keeps answering 503 to payment webhooks"
            description: For 30 minutes a webhook has reported a success without the money, and the provider's record does not show it or cannot be read.
            runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentwebhooksdeferred
