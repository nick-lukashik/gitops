rule_files:
  - data.rules.yaml
evaluation_interval: 1m
tests:
  - name: Postgres stops answering the instance manager
    interval: 1m
    input_series:
      - series: 'cnpg_collector_up{namespace="data",pod="pg-1",cluster="pg",job="data/pg"}'
        values: '1x5 0x15'
      - series: 'kube_pod_owner{namespace="data",pod="pg-1",owner_kind="Cluster",owner_name="pg",owner_is_controller="true"}'
        values: '1x20'
      - series: 'kube_pod_status_ready{namespace="data",pod="pg-1",condition="true"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: PostgresInstanceDown
        exp_alerts: []
      - eval_time: 12m
        alertname: PostgresInstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: data
              pod: pg-1
            exp_annotations:
              summary: Postgres data/pg-1 is down or not ready
              description: Every api keeps its data there; their requests on the database fail until it is back.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#postgresinstancedown

  - name: Postgres pod not ready or Pending; other pods do not count
    interval: 1m
    input_series:
      # Not ready from 6m; its metrics endpoint is gone with it.
      - series: 'cnpg_collector_up{namespace="data",pod="pg-1",cluster="pg",job="data/pg"}'
        values: '1x5'
      - series: 'kube_pod_owner{namespace="data",pod="pg-1",owner_kind="Cluster",owner_name="pg",owner_is_controller="true"}'
        values: '1x20'
      - series: 'kube_pod_status_ready{namespace="data",pod="pg-1",condition="true"}'
        values: '1x5 0x15'
      # Pending from the start: no Ready condition, no metrics.
      - series: 'kube_pod_owner{namespace="data",pod="pg-2",owner_kind="Cluster",owner_name="pg",owner_is_controller="true"}'
        values: '1x20'
      - series: 'kube_pod_owner{namespace="data",pod="redis-0",owner_kind="StatefulSet",owner_name="redis",owner_is_controller="true"}'
        values: '1x20'
      - series: 'kube_pod_status_ready{namespace="data",pod="redis-0",condition="true"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: PostgresInstanceDown
        exp_alerts: []
      - eval_time: 7m
        alertname: PostgresInstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: data
              pod: pg-2
            exp_annotations:
              summary: Postgres data/pg-2 is down or not ready
              description: Every api keeps its data there; their requests on the database fail until it is back.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#postgresinstancedown
      - eval_time: 12m
        alertname: PostgresInstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: data
              pod: pg-1
            exp_annotations:
              summary: Postgres data/pg-1 is down or not ready
              description: Every api keeps its data there; their requests on the database fail until it is back.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#postgresinstancedown
          - exp_labels:
              severity: critical
              namespace: data
              pod: pg-2
            exp_annotations:
              summary: Postgres data/pg-2 is down or not ready
              description: Every api keeps its data there; their requests on the database fail until it is back.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#postgresinstancedown

  - name: WAL archiving keeps failing; failures the retry fixes do not fire
    interval: 1m
    input_series:
      # data/pg-1: every attempt fails from 6m on, the last success was at 100 s.
      - series: 'cnpg_pg_stat_archiver_failed_count{namespace="data",pod="pg-1"}'
        values: '0x5 3+3x15'
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="data",pod="pg-1"}'
        values: '-1x5 360+60x15'
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="data",pod="pg-1"}'
        values: '100x20'
      # staging/pg-1: a failure every minute from 330 s, each segment archived on the retry 10 s later.
      - series: 'cnpg_pg_stat_archiver_failed_count{namespace="staging",pod="pg-1"}'
        values: '0x5 1+1x15'
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="staging",pod="pg-1"}'
        values: '-1x5 330+60x15'
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="staging",pod="pg-1"}'
        values: '100x5 340+60x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: PostgresWALArchivingFailing
        exp_alerts: []
      - eval_time: 12m
        alertname: PostgresWALArchivingFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: data
              pod: pg-1
            exp_annotations:
              summary: Postgres data/pg-1 does not archive WAL
              description: WAL does not reach R2, so a restore stops at the last archived segment, and pg_wal grows until the volume is full.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#postgreswalarchivingfailing

  - name: WAL waits and nothing is archived (a hung archiver); an idle Postgres does not fire
    interval: 1m
    input_series:
      # data/pg-1: a segment is ready from 5m, nothing archived, no failure counted.
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="data",pod="pg-1"}'
        values: '0+60x25'
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="data",pod="pg-1",value="ready"}'
        values: '0x5 1x20'
      - series: 'cnpg_pg_stat_archiver_failed_count{namespace="data",pod="pg-1"}'
        values: '0x25'
      # staging/pg-1: no WAL written, so nothing to archive.
      - series: 'cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="staging",pod="pg-1"}'
        values: '0+60x25'
      - series: 'cnpg_collector_pg_wal_archive_status{namespace="staging",pod="pg-1",value="ready"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 18m
        alertname: PostgresWALArchivingFailing
        exp_alerts: []
      - eval_time: 22m
        alertname: PostgresWALArchivingFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: data
              pod: pg-1
            exp_annotations:
              summary: Postgres data/pg-1 does not archive WAL
              description: WAL does not reach R2, so a restore stops at the last archived segment, and pg_wal grows until the volume is full.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#postgreswalarchivingfailing

  - name: last base backup older than 26 hours; a nightly one does not fire
    interval: 1m
    input_series:
      # time() is 0 at the start of the test. data/pg-1: the last backup at 1h.
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="data",pod="pg-1"}'
        values: '3600x1700'
      # staging/pg-1: backups at 1h and 24h.
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="staging",pod="pg-1"}'
        values: '3600x1440 86400x260'
    alert_rule_test:
      - eval_time: 27h10m
        alertname: PostgresBackupTooOld
        exp_alerts: []
      - eval_time: 27h30m
        alertname: PostgresBackupTooOld
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: data
              pod: pg-1
            exp_annotations:
              summary: Postgres data/pg-1 has no base backup from the last 26 hours
              description: The last successful base backup is 1d 2h 30m 0s old; the nightly backup failed or did not run.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#postgresbackuptooold
