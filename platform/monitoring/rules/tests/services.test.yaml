rule_files:
  - services.rules.yaml
evaluation_interval: 1m
tests:
  - name: database errors for 5 minutes
    interval: 1m
    input_series:
      - series: 'http_server_database_failures_total{namespace="prod",service="notes-api",pod="notes-api-1"}'
        values: '0x5 1+1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: ServiceDatabaseErrors
        exp_alerts: []
      - eval_time: 15m
        alertname: ServiceDatabaseErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: notes-api
            exp_annotations:
              summary: prod/notes-api fails requests on the database
              description: Requests end with 503 on Postgres timeouts, lock waits or a busy pool.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#servicedatabaseerrors

  - name: broker down, then a consumer stays down
    interval: 1m
    input_series:
      - series: 'messaging_broker_up{namespace="prod",service="notes-api",pod="notes-api-1"}'
        values: '1x5 0x10'
      - series: 'messaging_consumer_up{namespace="prod",service="notes-api",pod="notes-api-1",queue="notes-api.note-created"}'
        values: '1x5 0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: ServiceBrokerDown
        exp_alerts: []
      - eval_time: 12m
        alertname: ServiceBrokerDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: notes-api
            exp_annotations:
              summary: prod/notes-api has no RabbitMQ connection
              description: Writes still succeed; events wait in the outbox until the broker is back.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#servicebrokerdown
      - eval_time: 12m
        alertname: ServiceConsumerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: prod
              service: notes-api
              queue: notes-api.note-created
            exp_annotations:
              summary: prod/notes-api does not consume notes-api.note-created
              description: The consumer keeps failing to re-subscribe; events for this queue are not processed.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#serviceconsumerdown

  - name: outbox backlog older than 5 minutes
    interval: 1m
    input_series:
      - series: 'outbox_oldest_pending_seconds{namespace="prod",service="notes-api",pod="notes-api-1"}'
        values: '0x3 60+60x15'
    alert_rule_test:
      - eval_time: 8m
        alertname: OutboxEventsStuck
        exp_alerts: []
      - eval_time: 14m
        alertname: OutboxEventsStuck
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: prod
              service: notes-api
            exp_annotations:
              summary: prod/notes-api has events unpublished for over 5 minutes
              description: The oldest pending outbox event is 11m 0s old.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#outboxeventsstuck

  - name: unroutable events alert at once; other failures do not
    interval: 1m
    input_series:
      - series: 'outbox_publish_failures_total{namespace="prod",service="notes-api",pod="notes-api-1",reason="unavailable"}'
        values: '0+1x10'
      - series: 'outbox_publish_failures_total{namespace="prod",service="notes-api",pod="notes-api-1",reason="unroutable"}'
        values: '0x5 1x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: OutboxEventsUnroutable
        exp_alerts: []
      - eval_time: 7m
        alertname: OutboxEventsUnroutable
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: prod
              service: notes-api
            exp_annotations:
              summary: prod/notes-api publishes events no queue receives
              description: RabbitMQ returned published events (no bound queue); they stay in the outbox and are retried.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#outboxeventsunroutable

  - name: a dead-lettered event alerts at once; processed events do not
    interval: 1m
    input_series:
      - series: 'messaging_events_consumed_total{namespace="prod",service="notes-api",pod="notes-api-1",queue="notes-api.activity",outcome="processed"}'
        values: '0+5x10'
      - series: 'messaging_events_consumed_total{namespace="prod",service="notes-api",pod="notes-api-1",queue="notes-api.activity",outcome="dead_lettered"}'
        values: '0x5 1x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: ServiceEventsDeadLettered
        exp_alerts: []
      - eval_time: 7m
        alertname: ServiceEventsDeadLettered
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: notes-api
              queue: notes-api.activity
            exp_annotations:
              summary: prod/notes-api dead-lettered events of notes-api.activity
              description: Events failed every retry or were invalid; they wait in the dead-letter queue for a fix and a replay.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#serviceeventsdeadlettered

  - name: Redis down and rate limits unchecked
    interval: 1m
    input_series:
      - series: 'redis_up{namespace="prod",service="notes-api",pod="notes-api-1"}'
        values: '1x5 0x10'
      - series: 'rate_limit_fail_open_total{namespace="prod",service="notes-api",pod="notes-api-1"}'
        values: '0x5 1+1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: RateLimitFailingOpen
        exp_alerts: []
      - eval_time: 8m
        alertname: RateLimitFailingOpen
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: notes-api
            exp_annotations:
              summary: prod/notes-api cannot check rate limits
              description: "Redis is down or over its budget: the throttler lets requests through, id-api's sign-in limits refuse them (503)."
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#ratelimitfailingopen
      - eval_time: 8m
        alertname: ServiceRedisDown
        exp_alerts: []
      - eval_time: 12m
        alertname: ServiceRedisDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: notes-api
            exp_annotations:
              summary: prod/notes-api has no Redis connection
              description: The cache is bypassed and rate limits are not checked.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#serviceredisdown

  - name: the rate limiter counted with a key label still alerts once per service
    interval: 1m
    input_series:
      - series: 'rate_limit_fail_open_total{namespace="prod",service="id-api",pod="id-api-1",key="login"}'
        values: '0x5 1+1x10'
      - series: 'rate_limit_fail_open_total{namespace="prod",service="id-api",pod="id-api-1",key="code"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: RateLimitFailingOpen
        exp_alerts: []
      - eval_time: 8m
        alertname: RateLimitFailingOpen
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: id-api
            exp_annotations:
              summary: prod/id-api cannot check rate limits
              description: "Redis is down or over its budget: the throttler lets requests through, id-api's sign-in limits refuse them (503)."
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#ratelimitfailingopen

  - name: sign-in codes undelivered for 10 minutes; one lost code does not fire
    interval: 1m
    input_series:
      - series: 'auth_code_deliveries_total{namespace="prod",service="id-api",pod="id-api-1",result="accepted"}'
        values: '0+5x30'
      # prod: notifications-api unreachable from 6m on. A result's series appears with its first count.
      - series: 'auth_code_deliveries_total{namespace="prod",service="id-api",pod="id-api-1",result="unreachable"}'
        values: '_x6 1+1x24'
      # staging: one code refused at 6m.
      - series: 'auth_code_deliveries_total{namespace="staging",service="id-api",pod="id-api-1",result="failed"}'
        values: '_x6 1x24'
    alert_rule_test:
      - eval_time: 14m
        alertname: AuthCodeDeliveryFailing
        exp_alerts: []
      - eval_time: 17m
        alertname: AuthCodeDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: prod
              service: id-api
            exp_annotations:
              summary: prod/id-api does not deliver sign-in codes
              description: Users get no sign-in code (notifications-api unreachable or not sending), so they cannot sign in.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#authcodedeliveryfailing

  - name: sign-in codes reach half of the daily budget, then 80% of it, counted over the pods
    interval: 1m
    input_series:
      - series: 'auth_code_deliveries_total{namespace="prod",service="id-api",pod="a",result="accepted"}'
        values: '0+1x70'
      - series: 'auth_code_deliveries_total{namespace="prod",service="id-api",pod="a",result="failed"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: AuthCodeBudgetHalfUsed
        exp_alerts: []
      - eval_time: 40m
        alertname: AuthCodeBudgetHalfUsed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: id-api
            exp_annotations:
              summary: prod/id-api has sent half of its daily budget of sign-in codes
              description: 35 of 70 sign-in codes went out in 24 hours, far more than usual.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#authcodebudgethalfused
      - eval_time: 50m
        alertname: AuthCodeBudgetNearlyUsed
        exp_alerts: []
      - eval_time: 60m
        alertname: AuthCodeBudgetNearlyUsed
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: prod
              service: id-api
            exp_annotations:
              summary: prod/id-api has nearly used its daily budget of sign-in codes
              description: 56 of 70 sign-in codes went out in 24 hours. At 70 sign-in by code stops for everyone.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#authcodebudgetnearlyused

  - name: an email job failed for good alerts at once, for an hour
    interval: 1m
    input_series:
      - series: 'emails_failed_total{namespace="prod",service="notifications-api",pod="notifications-api-1",template="receipt"}'
        values: '0x10 1x70'
      - series: 'emails_failed_total{namespace="prod",service="notifications-api",pod="notifications-api-1",template="welcome"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 10m
        alertname: EmailJobsFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: EmailJobsFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: notifications-api
              template: receipt
            exp_annotations:
              summary: prod/notifications-api gave up on receipt emails
              description: Email jobs failed every retry in the last hour; their users did not get them.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#emailjobsfailed
      - eval_time: 75m
        alertname: EmailJobsFailed
        exp_alerts: []

  - name: the first email job a pod fails for good alerts too (the series starts at 1)
    interval: 1m
    input_series:
      # The counter is not pre-initialized: its series appears with the first failure.
      - series: 'emails_failed_total{namespace="prod",service="notifications-api",pod="notifications-api-2",template="welcome"}'
        values: '_x10 1x70'
    alert_rule_test:
      - eval_time: 9m
        alertname: EmailJobsFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: EmailJobsFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: notifications-api
              template: welcome
            exp_annotations:
              summary: prod/notifications-api gave up on welcome emails
              description: Email jobs failed every retry in the last hour; their users did not get them.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#emailjobsfailed
      - eval_time: 75m
        alertname: EmailJobsFailed
        exp_alerts: []

  - name: a scrape gap an hour ago does not make an old series look new
    interval: 1m
    input_series:
      # Prometheus was down: no samples from 121m to 140m.
      - series: 'emails_failed_total{namespace="prod",service="notifications-api",pod="notifications-api-1",template="receipt"}'
        values: '3x120 _x20 3x120'
      # The target was down: a stale marker, then no samples.
      - series: 'emails_failed_total{namespace="prod",service="notifications-api",pod="notifications-api-1",template="welcome"}'
        values: '2x120 stale _x19 2x120'
      # One failed scrape: the stale marker alone, shorter than the lookback.
      - series: 'emails_failed_total{namespace="prod",service="notifications-api",pod="notifications-api-2",template="receipt"}'
        values: '4x120 stale 4x120'
      # Pre-initialized at 0, nothing failed.
      - series: 'emails_failed_total{namespace="prod",service="notifications-api",pod="notifications-api-2",template="welcome"}'
        values: '0x120 _x20 0x120'
    alert_rule_test:
      # t-1h is the stale marker.
      - eval_time: 181m
        alertname: EmailJobsFailed
        exp_alerts: []
      # t-1h is in the gap, more than the 5 min lookback after the last sample.
      - eval_time: 190m
        alertname: EmailJobsFailed
        exp_alerts: []

  - name: a failure during a scrape gap alerts when the samples are back, then stops
    interval: 1m
    input_series:
      - series: 'emails_failed_total{namespace="prod",service="notifications-api",pod="notifications-api-1",template="receipt"}'
        values: '1x120 _x20 2x120'
      # Pre-initialized at 0, the first failure falls in the gap.
      - series: 'emails_failed_total{namespace="prod",service="notifications-api",pod="notifications-api-1",template="welcome"}'
        values: '0x120 _x20 1x120'
    alert_rule_test:
      - eval_time: 145m
        alertname: EmailJobsFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: notifications-api
              template: receipt
            exp_annotations:
              summary: prod/notifications-api gave up on receipt emails
              description: Email jobs failed every retry in the last hour; their users did not get them.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#emailjobsfailed
          - exp_labels:
              severity: warning
              namespace: prod
              service: notifications-api
              template: welcome
            exp_annotations:
              summary: prod/notifications-api gave up on welcome emails
              description: Email jobs failed every retry in the last hour; their users did not get them.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#emailjobsfailed
      # t-1h is in the gap: the failure has left the hour, and the series is not new.
      - eval_time: 190m
        alertname: EmailJobsFailed
        exp_alerts: []

  - name: unmatched and mismatched payment webhooks alert at once; other results do not
    interval: 1m
    input_series:
      - series: 'payment_webhooks_total{namespace="prod",service="pay-api",pod="pay-api-1",result="applied"}'
        values: '0+3x40'
      - series: 'payment_webhooks_total{namespace="prod",service="pay-api",pod="pay-api-1",result="rejected"}'
        values: '0+1x40'
      - series: 'payment_webhooks_total{namespace="prod",service="pay-api",pod="pay-api-1",result="unmatched"}'
        values: '0x5 1x35'
      - series: 'payment_webhooks_total{namespace="prod",service="pay-api",pod="pay-api-1",result="mismatch"}'
        values: '0x20 1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: PaymentWebhooksUnmatched
        exp_alerts: []
      - eval_time: 10m
        alertname: PaymentWebhooksUnmatched
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: pay-api
              result: unmatched
            exp_annotations:
              summary: prod/pay-api could not apply payment webhooks (unmatched)
              description: A provider webhook matched no payment (unmatched) or not its amount or currency (mismatch); the money it reports is not credited yet.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentwebhooksunmatched
      - eval_time: 25m
        alertname: PaymentWebhooksUnmatched
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: pay-api
              result: unmatched
            exp_annotations:
              summary: prod/pay-api could not apply payment webhooks (unmatched)
              description: A provider webhook matched no payment (unmatched) or not its amount or currency (mismatch); the money it reports is not credited yet.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentwebhooksunmatched
          - exp_labels:
              severity: warning
              namespace: prod
              service: pay-api
              result: mismatch
            exp_annotations:
              summary: prod/pay-api could not apply payment webhooks (mismatch)
              description: A provider webhook matched no payment (unmatched) or not its amount or currency (mismatch); the money it reports is not credited yet.
              runbook_url: https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentwebhooksunmatched
  - interval: 1m
    input_series:
      - series: 'payments_unreconciled{namespace="prod",service="pay-api"}'
        values: '0x10 2x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: PaymentsUnreconciled
        exp_alerts: []
      - eval_time: 25m
        alertname: PaymentsUnreconciled
        exp_alerts: []
      - eval_time: 45m
        alertname: PaymentsUnreconciled
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: prod
              service: pay-api
            exp_annotations:
              summary: "prod/pay-api has 2 paid payments not in the ledger"
              description: "Reconciliation has been sending these events again for 30 minutes and wallet-api still has no pack for them; the buyers paid and have no coins."
              runbook_url: "https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentsunreconciled"
  - interval: 1m
    input_series:
      - series: 'payment_reconciliation_total{namespace="prod",service="pay-api",result="republished"}'
        values: '0x20 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PaymentEventsRepublished
        exp_alerts: []
      - eval_time: 25m
        alertname: PaymentEventsRepublished
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: pay-api
            exp_annotations:
              summary: "prod/pay-api sent payment events to the ledger again"
              description: "A paid payment was not in the ledger past its grace period, so its event went out again. Coins were late; find out why the first event did not get there."
              runbook_url: "https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymenteventsrepublished"
  - interval: 1m
    input_series:
      - series: 'payment_provider_sync_total{namespace="prod",service="pay-api",result="mismatch"}'
        values: '0x20 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PaymentProviderMismatch
        exp_alerts: []
      - eval_time: 25m
        alertname: PaymentProviderMismatch
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: pay-api
            exp_annotations:
              summary: "prod/pay-api found a payment whose provider record differs"
              description: "The provider's own record of a pending payment shows another amount or currency. The payment stays pending and no coins are credited."
              runbook_url: "https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentprovidermismatch"
  - interval: 1m
    input_series:
      - series: 'payment_provider_sync_total{namespace="prod",service="pay-api",result="applied"}'
        values: '0x10 1x10 3x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: PaymentWebhooksLost
        exp_alerts: []
      - eval_time: 25m
        alertname: PaymentWebhooksLost
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: pay-api
            exp_annotations:
              summary: "prod/pay-api paid several payments whose webhooks never came"
              description: "Provider sync settled these payments, so the buyers got their coins, but late. The provider's webhooks are not reaching pay-api."
              runbook_url: "https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentwebhookslost"
  - interval: 1m
    input_series:
      - series: 'payment_provider_sync_total{namespace="prod",service="pay-api",result="error"}'
        values: '0+1x90'
      - series: 'payment_provider_sync_total{namespace="prod",service="pay-api",result="open"}'
        values: '0+1x10 10x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: PaymentProviderUnreachable
        exp_alerts: []
      - eval_time: 35m
        alertname: PaymentProviderUnreachable
        exp_alerts: []
      - eval_time: 75m
        alertname: PaymentProviderUnreachable
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: pay-api
            exp_annotations:
              summary: "prod/pay-api cannot ask the payment provider"
              description: "Every lookup of provider sync has failed for 30 minutes, so a payment whose webhook is lost stays pending until the provider answers again."
              runbook_url: "https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentproviderunreachable"
  - interval: 1m
    input_series:
      - series: 'payment_webhooks_total{namespace="prod",service="pay-api",result="deferred"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: PaymentWebhooksDeferred
        exp_alerts: []
      - eval_time: 45m
        alertname: PaymentWebhooksDeferred
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              service: pay-api
            exp_annotations:
              summary: "prod/pay-api keeps answering 503 to payment webhooks"
              description: "For 30 minutes a webhook has reported a success without the money, and the provider's record does not show it or cannot be read."
              runbook_url: "https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#paymentwebhooksdeferred"
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="prod",cronjob="digests"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 1500m
        alertname: CronJobOverdue
        exp_alerts: []
      - eval_time: 1600m
        alertname: CronJobOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: prod
              cronjob: digests
            exp_annotations:
              summary: "prod/digests has not succeeded for over 26 hours"
              description: "A job that runs every day has not finished successfully since yesterday; its digest did not arrive."
              runbook_url: "https://github.com/nick-lukashik/gitops/blob/master/docs/runbook/alerts.md#cronjoboverdue"
