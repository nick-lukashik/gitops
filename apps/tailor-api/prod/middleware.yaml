# cv.<domain>/<id>/<file> -> /api/v1/cv/<id>/<file>. Every path of the host is rewritten
# under /api/v1/cv, so nothing else of tailor-api (the applications, health,
# OpenAPI) is reachable from the internet; tailor-web calls it inside the cluster.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailor-api-cv
spec:
  replacePathRegex:
    regex: ^/(.*)$
    replacement: /api/v1/cv/$1
