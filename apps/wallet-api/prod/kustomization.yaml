# The coin wallet and its ledger (repo wallet-api).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - service.yaml
  - wallet-api-secrets.sealedsecret.yaml
components:
  # No public route: only the platform's pods call it.
  - ../../../components/service
  - ../../../components/api
  - ../../../components/internal
# Non-secret runtime env of the pods and the migrate Job (envFrom). Everything
# else has the production value as its default in the service.
configMapGenerator:
  - name: wallet-api-config
    literals:
      - LOG_LEVEL=info
      # 4 replicas x 5 connections per api at most (docs/runbook/postgres.md).
      - DATABASE_POOL_MAX=5
# Images only by digest. The first digest and source-sha are set by hand from
# the summary of job "image" of wallet-api; then the deploy PR keeps them current.
images:
  - name: ghcr.io/nick-lukashik/wallet-api
    digest: sha256:9c2ddcea1ad80b53d1241f0e1f6f3214507efdab4cc79c48460e650b1329d959
commonAnnotations:
  nick-lukashik.com/source-sha: "8f98d8ea136353ad3947f8fb12996037d468afa7"
  nick-lukashik.com/source-repo: nick-lukashik/wallet-api
patches:
  # Who may call this api, one entry per caller. A caller missing here gets a timeout, and
  # only in prod: e2e runs without network policies.
  - target:
      kind: NetworkPolicy
      labelSelector: app.kubernetes.io/component=server
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: id-web
          ports:
            - port: http
  # It calls other apis (JWKS of id-api at least): the one label for both
  # directions of api calls (platform/policies/prod.yaml, components/api).
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
      spec:
        template:
          metadata:
            labels:
              nick-lukashik.com/api-client: "true"
