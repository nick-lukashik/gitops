# Identity: users, sign-in (email code, Google, passkeys), sessions, tokens (repo id-api).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - service.yaml
  - id-api-secrets.sealedsecret.yaml
components:
  # No public route: only the platform's pods call it.
  - ../../../components/service
  - ../../../components/api
  - ../../../components/internal
# Non-secret runtime env of the pods and the migrate Job (envFrom). Everything
# else has the production value as its default in the service.
configMapGenerator:
  - name: id-api-config
    literals:
      - LOG_LEVEL=info
      # 4 replicas x 5 connections per api at most (docs/runbook/postgres.md).
      - DATABASE_POOL_MAX=5
      # id-web forwards the client address (rate limits, sessions list).
      - TRUST_PROXY_HOPS=1
# Images only by digest. The first digest and source-sha are set by hand from
# the summary of job "image" of id-api; then the deploy PR keeps them current.
images:
  - name: ghcr.io/nick-lukashik/id-api
    digest: sha256:828f8dce31bf5988947fc01008f3b567c41419d4554b43703fe7712df82cc923
commonAnnotations:
  nick-lukashik.com/source-sha: "6ee87e43643642c629838e60772e53c25e3618ec"
  nick-lukashik.com/source-repo: nick-lukashik/id-api
patches:
  # Who may call this api, one entry per caller. A caller missing here gets a timeout, and
  # only in prod: e2e runs without network policies.
  - target:
      kind: NetworkPolicy
      labelSelector: app.kubernetes.io/component=server
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: id-web
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: landing-web
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: notifications-api
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: wallet-api
            # Tailor: the site reads /me and refreshes the session, the api reads the JWKS.
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: tailor-web
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: tailor-api
          ports:
            - port: http
