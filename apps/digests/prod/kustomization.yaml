# The daily digest of Google Analytics in the Telegram topic Digests (repo digests):
# a CronJob, with no server, route or autoscaler. The secret holds the key and the ids.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - cronjob.yaml
  - networkpolicy.yaml
  - digests-secrets.sealedsecret.yaml
configMapGenerator:
  - name: digests-config
    literals:
      - LOG_LEVEL=info
# The first digest and source-sha are set by hand; then the deploy PR keeps them current.
images:
  - name: ghcr.io/nick-lukashik/digests
    digest: sha256:874565f1e6a2cfef5d83355c47cb9ace0a4929bf5e8a97d0c9bcbd65824d7b6c
commonAnnotations:
  nick-lukashik.com/source-sha: "95ed29b8a6a4fb270be59444a81e67742bae97e7"
  nick-lukashik.com/source-repo: nick-lukashik/digests
