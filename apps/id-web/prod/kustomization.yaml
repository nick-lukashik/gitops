# The account site on id.<domain> (repo id-web): sign-in, account, wallet,
# payments, notifications, the session cookie of the sites under the domain, and
# sign-in and sign-out for a site on another domain.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - service.yaml
components:
  - ../../../components/service
  - ../../../components/web
  - ../../../components/subdomain
# Non-secret runtime env of the pods (envFrom). The api URLs and
# FORM_ACTION_ORIGINS have the production values as defaults in id-web.
configMapGenerator:
  - name: id-web-config
    literals:
      - LOG_LEVEL=info
      - ROBOTS=index
      # Public on every page. It loads on every visit; the banner only says so (README of the service).
      - GTM_ID=GTM-MTGKCHJ6
      # Filled from the route below: the domain lives only in components/settings.
      - SITE_URL=https://HOST
images:
  - name: ghcr.io/nick-lukashik/id-web
    digest: sha256:a41770a1f1d28963dde1232667e523b47e3acd9fe23cb8b15d36f62a6ddd980b
commonAnnotations:
  nick-lukashik.com/source-sha: "f3a453c1a7c8f57fcb408668fd2d5ee15891e073"
  nick-lukashik.com/source-repo: nick-lukashik/id-web
replacements:
  # SITE_URL=https://<host of the IngressRoute>.
  - source:
      kind: IngressRoute
      fieldPath: metadata.annotations.nl-gitops/host
    targets:
      - select:
          kind: ConfigMap
          name: id-web-config
        fieldPaths:
          - data.SITE_URL
        options:
          delimiter: //
          index: 1
patches:
  - target:
      kind: IngressRoute
    patch: |-
      - op: replace
        path: /metadata/annotations/nl-gitops~1smoke-paths
        value: /login
