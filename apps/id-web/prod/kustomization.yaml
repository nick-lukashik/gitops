# The account site on id.<domain> (repo id-web): sign-in, account, wallet,
# payments, notifications, and sign-in and sign-out for the other sites.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - service.yaml
  - id-web-secrets.sealedsecret.yaml
components:
  - ../../../components/service
  - ../../../components/web
  - ../../../components/subdomain
# Non-secret runtime env of the pods (envFrom). The api URLs and
# FORM_ACTION_ORIGINS have the production values as defaults in id-web.
configMapGenerator:
  - name: id-web-config
    literals:
      - LOG_LEVEL=info
      - ROBOTS=index
      # Filled from the route below: the domain lives only in components/settings.
      - SITE_URL=https://HOST
images:
  - name: ghcr.io/nick-lukashik/id-web
    digest: sha256:15cbd13a38e183b8e91c404feac57eac529cb9e6acb983136fda94b2b115a905
commonAnnotations:
  nick-lukashik.com/source-sha: "46d00447b4a748daaa21f7409bef46c2792aa805"
  nick-lukashik.com/source-repo: nick-lukashik/id-web
replacements:
  # SITE_URL=https://<host of the IngressRoute>.
  - source:
      kind: IngressRoute
      fieldPath: metadata.annotations.nl-gitops/host
    targets:
      - select:
          kind: ConfigMap
          name: id-web-config
        fieldPaths:
          - data.SITE_URL
        options:
          delimiter: //
          index: 1
patches:
  - target:
      kind: IngressRoute
    patch: |-
      - op: replace
        path: /metadata/annotations/nl-gitops~1smoke-paths
        value: /login
