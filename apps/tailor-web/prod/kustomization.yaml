# Tailor (repo tailor-web) on tailor.<domain>: the applications from tailor-api
# through the /api proxy, signed in through id (the shared session cookie of
# the domain, SESSION_SECRET from web-session via components/web).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - service.yaml
components:
  - ../../../components/service
  - ../../../components/web
  - ../../../components/subdomain
# Non-secret runtime env of the pods (envFrom).
configMapGenerator:
  - name: tailor-web-config
    literals:
      - LOG_LEVEL=info
      - API_URL=http://tailor-api.prod.svc
      - ID_API_URL=http://id-api.prod.svc
      # Filled from the route below: https://id.<domain>.
      - ID_URL=https://id.HOST
      # Filled from the settings and the route below: the domain lives only in components/settings.
      - CV_URL=https://cv.DOMAIN
      - SITE_URL=https://HOST
images:
  - name: ghcr.io/nick-lukashik/tailor-web
    digest: sha256:f15952ef8a1aef826b9be1e6d5eae46c8a06d2bf482967efcca79b2774cbdd71
commonAnnotations:
  nick-lukashik.com/source-sha: "07e6731c6bef57d82af139930cf0e5b5d536abd1"
  nick-lukashik.com/source-repo: nick-lukashik/tailor-web
replacements:
  # ID_URL=https://id.<domain>: the settings' domain.
  - source:
      kind: Settings
      name: settings
      fieldPath: domain
    targets:
      - select:
          kind: ConfigMap
          name: tailor-web-config
        fieldPaths:
          - data.ID_URL
        options:
          delimiter: https://id.
          index: 1
  # SITE_URL=https://<host of the IngressRoute>.
  - source:
      kind: IngressRoute
      fieldPath: metadata.annotations.nl-gitops/host
    targets:
      - select:
          kind: ConfigMap
          name: tailor-web-config
        fieldPaths:
          - data.SITE_URL
        options:
          delimiter: //
          index: 1
  # CV_URL=https://cv.<domain>: the host of tailor-api's route.
  - source:
      kind: Settings
      name: settings
      fieldPath: domain
    targets:
      - select:
          kind: ConfigMap
          name: tailor-web-config
        fieldPaths:
          - data.CV_URL
        options:
          delimiter: cv.
          index: 1
patches:
  # robots.txt: every page and the whole API need a signed-in person with role
  # tailor (D-113), the rest go to the landing, and the smoke check has no session.
  # tailor-api keeps its own smoke on the public CV route.
  - target:
      kind: IngressRoute
    patch: |-
      - op: replace
        path: /metadata/annotations/nl-gitops~1smoke-paths
        value: /robots.txt
