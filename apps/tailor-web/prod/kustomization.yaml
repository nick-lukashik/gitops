# Tailor (repo tailor-web) on tailor.<domain>: the applications from tailor-api
# through the /api proxy, signed in through id (the shared session cookie of
# the domain, SESSION_SECRET from web-session via components/web).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - service.yaml
components:
  - ../../../components/service
  - ../../../components/web
  - ../../../components/subdomain
# Non-secret runtime env of the pods (envFrom).
configMapGenerator:
  - name: tailor-web-config
    literals:
      - LOG_LEVEL=info
      # A personal tool for now: not in search engines.
      - ROBOTS=noindex
      - API_URL=http://tailor-api.prod.svc
      - ID_API_URL=http://id-api.prod.svc
      # Filled from the route below: https://id.<domain>.
      - ID_URL=https://id.HOST
      # Filled from the settings and the route below: the domain lives only in components/settings.
      - CV_URL=https://cv.DOMAIN
      - SITE_URL=https://HOST
images:
  - name: ghcr.io/nick-lukashik/tailor-web
    digest: sha256:099cefb78d02f96c99bce428948f1f01aae3c2e88b7978e91dcd080602a13529
commonAnnotations:
  nick-lukashik.com/source-sha: "b9aa356edc3e6a6224833738d84c703a67df0230"
  nick-lukashik.com/source-repo: nick-lukashik/tailor-web
replacements:
  # ID_URL=https://id.<domain>: the settings' domain.
  - source:
      kind: Settings
      name: settings
      fieldPath: domain
    targets:
      - select:
          kind: ConfigMap
          name: tailor-web-config
        fieldPaths:
          - data.ID_URL
        options:
          delimiter: https://id.
          index: 1
  # SITE_URL=https://<host of the IngressRoute>.
  - source:
      kind: IngressRoute
      fieldPath: metadata.annotations.nl-gitops/host
    targets:
      - select:
          kind: ConfigMap
          name: tailor-web-config
        fieldPaths:
          - data.SITE_URL
        options:
          delimiter: //
          index: 1
  # CV_URL=https://cv.<domain>: the host of tailor-api's route.
  - source:
      kind: Settings
      name: settings
      fieldPath: domain
    targets:
      - select:
          kind: ConfigMap
          name: tailor-web-config
        fieldPaths:
          - data.CV_URL
        options:
          delimiter: cv.
          index: 1
patches:
  # The page and a call through the proxy to tailor-api: a broken backend fails the smoke.
  - target:
      kind: IngressRoute
    patch: |-
      - op: replace
        path: /metadata/annotations/nl-gitops~1smoke-paths
        value: "/ /api/v1/applications?limit=1"
