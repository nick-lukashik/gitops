# The landing (Next.js, from next-starter) on the root domain.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - service.yaml
components:
  # Root domain: service (with the host) and the kind, no subdomain.
  - ../../../components/service
  - ../../../components/web
# Non-secret runtime env of the pods (envFrom). The name gets a content hash,
# so every change rolls the pods.
configMapGenerator:
  - name: landing-web-config
    literals:
      - LOG_LEVEL=info
      - ROBOTS=index
      # Filled from the route below: the domain lives only in components/settings.
      - SITE_URL=https://HOST
# Images only by digest. The first digest and source-sha are set by hand from
# the summary of job "image" of landing-web, in the PR that adds this folder;
# from then on the deploy PR (.github, deploy-pr.yml) replaces them in place:
# keep the keys, never add newName or newTag.
images:
  - name: ghcr.io/nick-lukashik/landing-web
    digest: sha256:6dfc7e3e081dd884e7d89bd0d9765a2c27fa4a1911583710f739c9702063e5b0
commonAnnotations:
  nick-lukashik.com/source-sha: "bda75defee3b05258ab8f6d0e36f1faf4621e9eb"
  nick-lukashik.com/source-repo: nick-lukashik/landing-web
replacements:
  # SITE_URL=https://<host of the IngressRoute>.
  - source:
      kind: IngressRoute
      fieldPath: metadata.annotations.nl-gitops/host
    targets:
      - select:
          kind: ConfigMap
          name: landing-web-config
        fieldPaths:
          - data.SITE_URL
        options:
          delimiter: //
          index: 1
