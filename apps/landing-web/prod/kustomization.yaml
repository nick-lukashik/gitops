# The landing (Next.js, from next-starter) on the root domain.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - service.yaml
  - landing-web-secrets.sealedsecret.yaml
components:
  # Root domain: service (with the host) and the kind, no subdomain.
  - ../../../components/service
  - ../../../components/web
# Non-secret runtime env of the pods (envFrom). The name gets a content hash,
# so every change rolls the pods.
configMapGenerator:
  - name: landing-web-config
    literals:
      - LOG_LEVEL=info
      - ROBOTS=index
      # Public on every page. Consent starts denied (README of the service).
      - GTM_ID=GTM-MTGKCHJ6
      # Filled from the route below: the domain lives only in components/settings.
      - SITE_URL=https://HOST
      # Accounts on (README of landing-web): the account site, and id-api in the cluster.
      - ID_URL=https://id.HOST
      - ID_API_URL=http://id-api.prod.svc
# Images only by digest. The first digest and source-sha are set by hand from
# the summary of job "image" of landing-web, in the PR that adds this folder;
# from then on the deploy PR (.github, deploy-pr.yml) replaces them in place:
# keep the keys, never add newName or newTag.
images:
  - name: ghcr.io/nick-lukashik/landing-web
    digest: sha256:94a8a12ceac906ab4cc4dd748fea69269f29c826dde51da8d78fe1caab7897ac
commonAnnotations:
  nick-lukashik.com/source-sha: "961fb5dda381a5f0a44ccbb81639b3ec790c1f11"
  nick-lukashik.com/source-repo: nick-lukashik/landing-web
replacements:
  # SITE_URL=https://<host of the IngressRoute>.
  - source:
      kind: IngressRoute
      fieldPath: metadata.annotations.nl-gitops/host
    targets:
      - select:
          kind: ConfigMap
          name: landing-web-config
        fieldPaths:
          - data.SITE_URL
        options:
          delimiter: //
          index: 1
  # ID_URL=https://id.<host of the IngressRoute>.
  - source:
      kind: IngressRoute
      fieldPath: metadata.annotations.nl-gitops/host
    targets:
      - select:
          kind: ConfigMap
          name: landing-web-config
        fieldPaths:
          - data.ID_URL
        options:
          delimiter: https://id.
          index: 1
