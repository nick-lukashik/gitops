# valuesContent of HelmChart kube-system/traefik in K3s v1.36.5+k3s1
# (k3s-io/k3s manifests/traefik.yaml), without global.systemDefaultRegistry.
# Used only by scripts/render-helm.sh; update together with the K3s version.
deployment:
  podAnnotations:
    prometheus.io/port: "8082"
    prometheus.io/scrape: "true"
providers:
  kubernetesIngress:
    publishedService:
      enabled: true
priorityClassName: "system-cluster-critical"
image:
  repository: "rancher/mirrored-library-traefik"
  tag: "3.7.13"
tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Exists"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
service:
  spec:
    ipFamilyPolicy: "PreferDualStack"
